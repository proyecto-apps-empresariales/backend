spring.application.name=demoAPI

spring.datasource.url=jdbc:mysql://localhost:3306/docucmb
spring.datasource.username=root
spring.datasource.password=admin

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mostrar error real de JPA/Hibernate
logging.level.org.hibernate=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.test=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG


# Seguridad JWT + CORS (Fase 1: sin secretos embebidos aqui)
# security.jwt.secret se define por perfil (dev/test con fallback local; prod obligatorio via env)
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.jwt.secret=VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Semilla de usuarios demo: desactivado por defecto; perfil dev lo activa (ver application-dev.properties).
# ProducciÃ³n: nunca true salvo proceso explÃ­cito de bootstrap controlado.
security.seed.enabled=false

